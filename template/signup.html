.password-box{

    top: 50%;

    color: #fff;
    cursor: pointer;
    user-select: none;
}

    padding: 12px;
    font-size: 15px;
    background: rgba(255,255,255,0.3);
    color: #fff;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.signup-btn:hover{
    background: rgba(255,255,255,0.5);
}

.google-btn{
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    background: rgba(255,255,255,0.3);
    border: 1px solid rgba(255,255,255,0.5);
    cursor: pointer;
    font-size: 14px;
    color: #fff;
    border-radius: 5px;
}

.footer-text{
    font-size: 12px;
    color: #ddd;
    margin-top: 18px;
    line-height: 1.5;
}

.footer-text a{
    color: #fff;
    text-decoration: none;
    font-weight: 500;
}
.google{
    padding: 10px;
    border-radius: 40px;
    width: 90%;
    margin-left: 20px;
    background: transparent;
    border: white solid;

        span{

button.signup-btn {

    padding: 12px;
    font-size: 16px;
    background: rgba(255, 255, 255, 0.3); /* semi-transparent */
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    margin-bottom: 10px;
}

button.signup-btn:hover {
    background: rgba(255, 255, 255, 0.5);
    transform: scale(1.02); /* subtle zoom effect */
}

<script>
const pwd = document.getElementById("password");
const toggle = document.getElementById("togglePwd");

toggle.addEventListener("click", () => {
    if (pwd.type === "password") {
        pwd.type = "text";
        toggle.innerText = "Hide";
    } else {
        pwd.type = "password";
        toggle.innerText = "Show";
    }
});
</script>
